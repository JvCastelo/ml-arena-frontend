<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ML Arena{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('index') }}">ML Arena</a>
      <div class="navbar-nav me-auto">
        {% if user_name %}
        <a class="nav-link" href="{{ url_for('runs_list') }}">Runs</a>
        <a class="nav-link" href="{{ url_for('new_run_form') }}">Nova run</a>
        <a class="nav-link" href="{{ url_for('compare_battle') }}">Comparar</a>
        {% endif %}
      </div>
      {% if user_name %}
        <span class="navbar-text text-light me-2">{{ user_name }}</span>
        <form method="post" action="{{ url_for('logout') }}" class="d-inline">
          <button class="btn btn-sm btn-outline-light" type="submit">Sair</button>
        </form>
      {% else %}
        <a class="nav-link text-light" href="{{ url_for('login_form') }}">Entrar</a>
        <a class="nav-link text-light" href="{{ url_for('register_form') }}">Criar conta</a>
      {% endif %}
    </div>
  </nav>
  <div class="container pb-5">
    {% for m in messages %}
      <div class="alert alert-{{ m.category }} alert-dismissible fade show" role="alert">
        {{ m.message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
