{% extends "base.html" %}
{% block title %}Criar conta · ML Arena{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Criar conta</h1>
<form method="post" class="bg-white p-4 rounded shadow-sm" style="max-width: 420px;">
  <div class="mb-3">
    <label class="form-label">Nome</label>
    <input class="form-control" type="text" name="name" required value="{{ name or '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">E-mail</label>
    <input class="form-control" type="email" name="email" required value="{{ email or '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Senha</label>
    <input class="form-control" type="password" name="password" required>
  </div>
  <button class="btn btn-primary" type="submit">Criar conta</button>
  <a class="btn btn-link" href="{{ url_for('login_form') }}">Já tenho conta</a>
</form>
{% endblock %}
