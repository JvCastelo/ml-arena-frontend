{% extends "base.html" %}
{% block title %}Upload de CSV · ML Arena{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Upload de CSV — {{ run.name }}</h1>
<p class="text-muted">
  Algoritmo: <span class="badge text-bg-secondary">{{ run.algorithm }}</span>
  Status atual: <span class="badge text-bg-secondary">{{ run.status }}</span>
</p>
<form method="post" enctype="multipart/form-data" class="bg-white p-4 rounded shadow-sm" style="max-width: 640px;">
  <div class="mb-3">
    <label class="form-label">CSV medido × previsto</label>
    <input class="form-control" type="file" name="csv_file" accept=".csv" required>
    <div class="form-text">
      Precisa ter as colunas <code>measured</code> e <code>predicted</code>, até 5 MB.
    </div>
  </div>
  <button class="btn btn-primary" type="submit">Enviar CSV</button>
  <a class="btn btn-link" href="{{ url_for('runs_list') }}">Cancelar</a>
</form>
{% endblock %}
